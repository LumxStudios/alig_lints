include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - example/**
    - example_flutter/**
    # Fixtures are intentionally bad code fed to the rules under test.
    - test/fixtures/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
