name: example_single_widget
description: >
  expect_lint goldens for prefer-single-widget-per-file, which needs a package laid
  out the way it prescribes — one widget per file. The main golden packages
  deliberately are not; see doc/LIMITATIONS.md.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  alig_lints:
    path: ../
  custom_lint: ^0.8.1
