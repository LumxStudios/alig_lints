name: example_single_widget
description: >
  expect_lint goldens for the two rules about file layout —
  prefer-single-widget-per-file and prefer-match-file-name. Both need a package
  laid out the way they prescribe, which the main golden packages deliberately are
  not; see doc/LIMITATIONS.md.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  alig_lints:
    path: ../
  custom_lint: ^0.8.1
