# Only the plugin is enabled here. The built-in lint preset is deliberately
# left out: golden files contain intentionally bad code, and built-in lints
# firing on it would drown out the signal from the rules under test.
analyzer:
  plugins:
    - custom_lint
  errors:
    unused_local_variable: ignore
    unused_element: ignore
    unused_field: ignore
    dead_code: ignore

custom_lint:
  rules:
    # Goldens pair one helper type with the functions that demonstrate a rule, so
    # the file is named after the rule rather than the type. Verified in
    # example_single_widget instead.
    - prefer-match-file-name: false
