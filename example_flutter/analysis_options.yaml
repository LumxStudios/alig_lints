# Only the plugin is enabled here. The built-in lint preset is deliberately
# left out: golden files contain intentionally bad code, and built-in lints
# firing on it would drown out the signal from the rules under test.
analyzer:
  plugins:
    - custom_lint
  errors:
    unused_local_variable: ignore
    unused_element: ignore
    unused_field: ignore
    dead_code: ignore

# Every golden here holds several widgets on purpose: a rule's positive and
# negative cases belong side by side, where the contrast is readable.
# prefer-single-widget-per-file is verified in example_single_widget instead — a
# package whose files really do hold one widget each.
custom_lint:
  rules:
    - prefer-single-widget-per-file: false
